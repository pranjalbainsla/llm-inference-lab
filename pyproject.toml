[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "A modular LLM inference service for studying modern inference systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "torch>=2.6",
    "transformers"
]

[project.optional-dependencies]
dev = [
    "pytest",
]
